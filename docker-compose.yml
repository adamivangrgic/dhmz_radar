services:
  dhmz-radar:
    build: .
    container_name: dhmz-radar
    ports:
      - "8080:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      - TZ=Europe/Zagreb
    # Optional: uncomment to pass MQTT credentials as env rather than config UI
    # environment:
    #   - TZ=Europe/Zagreb
    #   - MQTT_HOST=192.168.1.x
    #   - MQTT_PORT=1883
